<!DOCTYPE html>
<html lang="ceb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cake Bot</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 12px; background: #fff8f3; }
    h2 { margin: 0 0 8px; }
    #box { height: 70vh; overflow-y: auto; border: 1px solid #ddd; border-radius: 10px; padding: 10px; background: #fff; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; margin: 6px 0; white-space: pre-wrap; word-wrap: break-word; }
    .me { background: #0a58ca; color: #fff; margin-left: auto; }
    .bot { background: #f1f1f1; color: #222; margin-right: auto; }
    #row { display: flex; gap: 6px; margin-top: 8px; }
    #msg { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #e0457b; color: #fff; font-size: 16px; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <h2>🍰 Cake Bot</h2>
  <div id="box"></div>
  <div id="row">
    <input id="msg" placeholder="Pangutana..." autocomplete="off">
    <button id="btn">Send</button>
  </div>

  <script>
    const box = document.getElementById("box");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");
    const history = [];

    function add(cls, text) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
      return d;
    }

    add("bot", "Kumusta! Unsa akong matabang nimo bahin sa among cakes? 🎂");

    async function send() {
      const text = msg.value.trim();
      if (!text || btn.disabled) return;

      add("me", text);
      history.push({ role: "user", content: text });
      msg.value = "";
      btn.disabled = true;
      const typing = add("bot", "...");

      try {
        const r = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history: history })
        });
        const data = await r.json();
        typing.textContent = data.reply;
        if (r.ok) history.push({ role: "assistant", content: data.reply });
        else history.pop();
      } catch (e) {
        typing.textContent = "Naay problema sa koneksyon.";
        history.pop();
      }
      btn.disabled = false;
      msg.focus();
    }

    btn.addEventListener("click", send);
    msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
