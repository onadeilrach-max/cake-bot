<!DOCTYPE html>
<html>
<head>
    <title>Cake Shop AI Bot</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; padding: 20px; background: #fdf2f8; }
        #chat-box { width: 400px; height: 500px; border: 1px solid #ccc; background: white; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; }
        #input-area { display: flex; border-top: 1px solid #ccc; }
        input { flex: 1; padding: 10px; border: none; }
        button { padding: 10px; background: #ec4899; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-box">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask about cakes...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const messages = document.getElementById('messages');
            if(!input.value) return;

            messages.innerHTML += `<p><b>You:</b> ${input.value}</p>`;
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input.value})
            });
            const data = await response.json();
            messages.innerHTML += `<p><b>Bot:</b> ${data.reply}</p>`;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
