<!DOCTYPE html>
<html>
<head>
    <title>Sweet Moments Bot</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f4f4f9; }
        #chat-box { width: 350px; height: 450px; border: 1px solid #ccc; overflow-y: scroll; background: white; padding: 10px; margin-bottom: 10px; border-radius: 10px; }
        .msg { margin: 5px 0; padding: 8px; border-radius: 5px; }
        .user { background: #dcf8c6; text-align: right; }
        .bot { background: #ebebeb; text-align: left; }
        #input-area { display: flex; gap: 5px; }
        input { padding: 10px; width: 250px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px; cursor: pointer; background: #ff69b4; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>🎂 Sweet Moments Bot</h2>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Ask about cakes...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if (!input.value) return;

            const userText = input.value;
            chatBox.innerHTML += `<div class="msg user">${userText}</div>`;
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });
                const data = await response.json();
                
                // KINI ANG FIX: 'data.response' must match the Python key
                const botText = data.response || "No response from bot.";
                chatBox.innerHTML += `<div class="msg bot">${botText}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                chatBox.innerHTML += `<div class="msg bot">Error connecting to server.</div>`;
            }
        }
    </script>
</body>
</html>
